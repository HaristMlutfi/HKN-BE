<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Verification Code</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            background-color: #007bff;
            color: #ffffff;
            padding: 10px 0;
        }

        .content {
            margin: 20px 0;
        }

        .footer {
            text-align: center;
            color: #888888;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Verification Code</h1>
    </div>
    <div class="content">
        <p>Hello {{.Username}},</p>
        <p>Thank you for registering. Please use the following verification link and code to complete your registration:</p>
        <p>{{.VerificationLink}}</p>
        <h2>{{.VerificationCode}}</h2>
        <p>This code is valid for 10 minutes.</p>
        <br/>
    </div>
    <div class="footer">
        <p>If you did not request this code, please ignore this email.</p>
    </div>
</div>
</body>
</html>
